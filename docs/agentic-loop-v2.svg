<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#0d1b3a"/><stop offset="1" stop-color="#10254f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36a8ff"/><stop offset="1" stop-color="#0a4ea8"/>
    </linearGradient>
    <marker id="loopArr" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5fb0ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="92" font-size="48" font-weight="800" fill="#ffffff">How an agent works</text>
  <text x="80" y="138" font-size="23" fill="#9fb6d6">It doesn&#8217;t follow a fixed script &#8212; it reasons in a loop until the goal is done.</text>

  <!-- ===== The loop: 4 nodes around a center, clockwise ===== -->
  <!-- center -->
  <g transform="translate(800,470)">
    <circle r="115" fill="url(#core)"/>
    <circle r="115" fill="none" stroke="#5fb0ff" stroke-opacity="0.35" stroke-width="2"/>
    <!-- simple robot mark -->
    <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-44,-52)">
      <rect x="14" y="26" width="60" height="46" rx="12" fill="rgba(255,255,255,0.12)"/>
      <circle cx="34" cy="49" r="6" fill="#fff" stroke="none"/>
      <circle cx="54" cy="49" r="6" fill="#fff" stroke="none"/>
      <line x1="44" y1="10" x2="44" y2="26"/><circle cx="44" cy="9" r="4" fill="#fff" stroke="none"/>
    </g>
    <text y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">The agent</text>
    <text y="84" text-anchor="middle" font-size="15" fill="#bcd8ff">(LLM reasoning)</text>
  </g>

  <!-- clockwise connecting arcs between node anchor points (radius ~250 around center 800,470) -->
  <g fill="none" stroke="#5fb0ff" stroke-width="3" marker-end="url(#loopArr)">
    <!-- top -> right -->
    <path d="M965 320 A 250 250 0 0 1 1050 470"/>
    <!-- right -> bottom -->
    <path d="M1050 470 A 250 250 0 0 1 965 620"/>
    <!-- bottom -> left -->
    <path d="M635 620 A 250 250 0 0 1 550 470"/>
    <!-- left -> top -->
    <path d="M550 470 A 250 250 0 0 1 635 320"/>
  </g>

  <!-- NODE 1: Understand (top) -->
  <g transform="translate(660,210)">
    <rect width="280" height="120" rx="18" fill="#16243f" />
    <rect width="280" height="120" rx="18" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#5fb0ff"/>
    <text x="34" y="43" text-anchor="middle" font-size="20" font-weight="800" fill="#06132b">1</text>
    <text x="64" y="42" font-size="24" font-weight="700" fill="#ffffff">Understand</text>
    <text x="22" y="76" font-size="16" fill="#bcd0ec">Read the message + context:</text>
    <text x="22" y="100" font-size="16" fill="#bcd0ec">the record, the chat, your instructions.</text>
  </g>

  <!-- NODE 2: Decide (right) -->
  <g transform="translate(1050,410)">
    <rect width="280" height="120" rx="18" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#5fb0ff"/>
    <text x="34" y="43" text-anchor="middle" font-size="20" font-weight="800" fill="#06132b">2</text>
    <text x="64" y="42" font-size="24" font-weight="700" fill="#ffffff">Decide</text>
    <text x="22" y="76" font-size="16" fill="#bcd0ec">Answer directly, or pick the</text>
    <text x="22" y="100" font-size="16" fill="#bcd0ec">right action to call next.</text>
  </g>

  <!-- NODE 3: Act (bottom) -->
  <g transform="translate(660,620)">
    <rect width="280" height="120" rx="18" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#5fb0ff"/>
    <text x="34" y="43" text-anchor="middle" font-size="20" font-weight="800" fill="#06132b">3</text>
    <text x="64" y="42" font-size="24" font-weight="700" fill="#ffffff">Act</text>
    <text x="22" y="76" font-size="16" fill="#bcd0ec">Run an action &#8212; log a note,</text>
    <text x="22" y="100" font-size="16" fill="#bcd0ec">summarize, query records.</text>
  </g>

  <!-- NODE 4: Observe (left) -->
  <g transform="translate(270,410)">
    <rect width="280" height="120" rx="18" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#5fb0ff"/>
    <text x="34" y="43" text-anchor="middle" font-size="20" font-weight="800" fill="#06132b">4</text>
    <text x="64" y="42" font-size="24" font-weight="700" fill="#ffffff">Observe</text>
    <text x="22" y="76" font-size="16" fill="#bcd0ec">Read the result. Done? If not,</text>
    <text x="22" y="100" font-size="16" fill="#bcd0ec">loop again with what it learned.</text>
  </g>

  <!-- bottom framing strip: instructions + actions -->
  <g>
    <rect x="80" y="800" width="700" height="64" rx="14" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <text x="104" y="832" font-size="16" font-weight="700" fill="#5fb0ff">YOU WRITE</text>
    <text x="104" y="854" font-size="16" fill="#dceaff">Instructions &#8212; the agent&#8217;s judgment.</text>

    <rect x="820" y="800" width="700" height="64" rx="14" fill="#16243f" stroke="#345488" stroke-width="1.5"/>
    <text x="844" y="832" font-size="16" font-weight="700" fill="#5fb0ff">YOU ADD</text>
    <text x="844" y="854" font-size="16" fill="#dceaff">Actions &#8212; the agent&#8217;s capabilities.</text>
  </g>
</svg>

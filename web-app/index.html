<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/salesforce_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build your own Agentforce Employee Agent — a meeting-note agent — in a hands-on workshop." />
    <title>Employee Agent V1 Workshop — Build Your Own Agentforce Agent</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pronto-workshop-theme');
          var theme = t === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

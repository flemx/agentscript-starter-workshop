<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="agentg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b9bff"/><stop offset="1" stop-color="#0a4ea8"/>
    </linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b9bff"/>
    </marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0a2a55" flood-opacity="0.16"/>
    </filter>
  </defs>

  <text x="520" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#0a2540">What the meeting-note agent does</text>

  <!-- INPUT -->
  <g filter="url(#sh2)">
    <rect x="40" y="120" width="190" height="120" rx="16" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/>
  </g>
  <text x="135" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#0a2540">Your notes</text>
  <text x="135" y="186" text-anchor="middle" font-size="13.5" fill="#5b6b85">text &#183; upload</text>
  <text x="135" y="206" text-anchor="middle" font-size="13.5" fill="#5b6b85">&#183; voice</text>

  <!-- AGENT (center) -->
  <g filter="url(#sh2)">
    <circle cx="420" cy="180" r="80" fill="url(#agentg)"/>
  </g>
  <g transform="translate(388,150)" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="14" width="52" height="40" rx="9" fill="rgba(255,255,255,0.15)"/>
    <circle cx="24" cy="33" r="5" fill="#fff" stroke="none"/>
    <circle cx="40" cy="33" r="5" fill="#fff" stroke="none"/>
    <line x1="32" y1="3" x2="32" y2="14"/><circle cx="32" cy="3" r="3" fill="#fff" stroke="none"/>
  </g>
  <text x="420" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">The Agent</text>

  <!-- arrow input -> agent -->
  <line x1="232" y1="180" x2="332" y2="180" stroke="#1b9bff" stroke-width="3" marker-end="url(#a2)"/>

  <!-- OUTPUTS (4 stacked) -->
  <g font-size="15" font-weight="600" fill="#0a2540">
    <g filter="url(#sh2)"><rect x="700" y="56" width="300" height="56" rx="12" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/></g>
    <text x="724" y="90" font-size="15.5">Summarizes the notes</text>

    <g filter="url(#sh2)"><rect x="700" y="128" width="300" height="56" rx="12" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/></g>
    <text x="724" y="162" font-size="15.5">Logs them to a Notes record</text>

    <g filter="url(#sh2)"><rect x="700" y="200" width="300" height="56" rx="12" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/></g>
    <text x="724" y="234" font-size="15.5">Creates follow-up tasks</text>

    <g filter="url(#sh2)"><rect x="700" y="272" width="300" height="56" rx="12" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/></g>
    <text x="724" y="306" font-size="15.5">Drafts a follow-up email</text>
  </g>

  <!-- branching arrows agent -> outputs -->
  <g stroke="#1b9bff" stroke-width="2.5" fill="none" marker-end="url(#a2)">
    <path d="M498 158 C 600 120, 620 90, 696 86"/>
    <path d="M500 174 C 600 165, 620 158, 696 158"/>
    <path d="M500 190 C 600 198, 620 220, 696 226"/>
    <path d="M498 206 C 600 250, 620 290, 696 298"/>
  </g>

  <text x="850" y="352" text-anchor="middle" font-size="13" fill="#7a8aa6">Summarize + log = the Part A MVP &#183; tasks + email = Part B</text>
</svg>

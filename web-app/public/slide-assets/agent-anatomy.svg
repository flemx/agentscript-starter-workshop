<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b9bff"/><stop offset="1" stop-color="#0a4ea8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a2a55" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="500" y="46" text-anchor="middle" font-size="30" font-weight="800" fill="#0a2540">The three parts of an agent</text>
  <text x="500" y="78" text-anchor="middle" font-size="17" fill="#5b6b85">Everything you build in Agent Studio is one of these three things.</text>

  <!-- AGENT card -->
  <g filter="url(#sh)">
    <rect x="80" y="120" width="260" height="280" rx="18" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/>
    <rect x="80" y="120" width="260" height="64" rx="18" fill="url(#hdr)"/>
    <rect x="80" y="150" width="260" height="34" fill="url(#hdr)"/>
    <text x="210" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Agent</text>
    <!-- robot glyph -->
    <g transform="translate(178,205)" stroke="#1b9bff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="52" height="42" rx="9" fill="#eaf4ff"/>
      <circle cx="24" cy="34" r="5" fill="#1b9bff" stroke="none"/>
      <circle cx="40" cy="34" r="5" fill="#1b9bff" stroke="none"/>
      <line x1="32" y1="2" x2="32" y2="14"/><circle cx="32" cy="2" r="3" fill="#1b9bff" stroke="none"/>
      <line x1="44" y1="46" x2="50" y2="46"/>
    </g>
    <text x="210" y="300" text-anchor="middle" font-size="16.5" fill="#33425b" font-weight="600">The assistant</text>
    <foreignObject x="100" y="312" width="220" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14.5px;color:#5b6b85;text-align:center;line-height:1.4">Its identity and settings. You give it a name and a job.</div>
    </foreignObject>
  </g>

  <!-- INSTRUCTIONS card -->
  <g filter="url(#sh)">
    <rect x="370" y="120" width="260" height="280" rx="18" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/>
    <rect x="370" y="120" width="260" height="64" rx="18" fill="url(#hdr)"/>
    <rect x="370" y="150" width="260" height="34" fill="url(#hdr)"/>
    <text x="500" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Instructions</text>
    <!-- speech/lines glyph -->
    <g transform="translate(468,200)" stroke="#1b9bff" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="0" y="6" width="64" height="46" rx="9" fill="#eaf4ff"/>
      <line x1="12" y1="22" x2="52" y2="22"/><line x1="12" y1="32" x2="52" y2="32"/><line x1="12" y1="42" x2="38" y2="42"/>
    </g>
    <text x="500" y="300" text-anchor="middle" font-size="16.5" fill="#33425b" font-weight="600">Its judgment</text>
    <foreignObject x="390" y="312" width="220" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14.5px;color:#5b6b85;text-align:center;line-height:1.4">Plain-language rules: what to do, when, and how to respond.</div>
    </foreignObject>
  </g>

  <!-- ACTIONS card -->
  <g filter="url(#sh)">
    <rect x="660" y="120" width="260" height="280" rx="18" fill="#ffffff" stroke="#d7e3f4" stroke-width="1.5"/>
    <rect x="660" y="120" width="260" height="64" rx="18" fill="url(#hdr)"/>
    <rect x="660" y="150" width="260" height="34" fill="url(#hdr)"/>
    <text x="790" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Actions</text>
    <!-- gear/bolt glyph -->
    <g transform="translate(758,198)" stroke="#1b9bff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="30" r="26" fill="#eaf4ff"/>
      <path d="M34 14 L24 32 L34 32 L30 46 L42 26 L32 26 Z" fill="#1b9bff" stroke="none"/>
    </g>
    <text x="790" y="300" text-anchor="middle" font-size="16.5" fill="#33425b" font-weight="600">Its capabilities</text>
    <foreignObject x="680" y="312" width="220" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14.5px;color:#5b6b85;text-align:center;line-height:1.4">The things it can actually do: log a note, summarize, query records.</div>
    </foreignObject>
  </g>

  <text x="500" y="438" text-anchor="middle" font-size="15.5" fill="#5b6b85" font-style="italic">Instructions give the agent judgment &#183; Actions give it the ability to act.</text>
</svg>

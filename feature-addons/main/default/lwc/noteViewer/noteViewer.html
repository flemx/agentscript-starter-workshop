<template>
    <lightning-card title="Notes" icon-name="standard:note">
        <template if:true={selected}>
            <lightning-button
                slot="actions"
                label="Download PDF"
                icon-name="utility:download"
                variant="brand"
                onclick={handleDownloadPdf}>
            </lightning-button>
        </template>

        <div class="slds-grid slds-grid_vertical-stretch viewer">
            <!-- Note list -->
            <div class="slds-col slds-size_1-of-3 note-list">
                <template if:true={isLoading}>
                    <div class="slds-p-around_medium slds-align_absolute-center">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <template if:true={hasNotes}>
                        <ul class="slds-has-dividers_bottom">
                            <template for:each={noteList} for:item="n">
                                <li
                                    key={n.contentDocumentId}
                                    class={n.cssClass}
                                    data-id={n.contentDocumentId}
                                    onclick={handleSelect}>
                                    <span class="note-title">{n.title}</span>
                                    <lightning-formatted-date-time
                                        value={n.modified}
                                        year="numeric" month="short" day="2-digit"
                                        class="note-date">
                                    </lightning-formatted-date-time>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:false={hasNotes}>
                        <div class="slds-p-around_medium slds-text-color_weak">No notes yet.</div>
                    </template>
                </template>
            </div>

            <!-- Note content -->
            <div class="slds-col slds-size_2-of-3 note-content slds-p-around_medium">
                <template if:true={error}>
                    <div class="slds-box slds-theme_error" role="alert">{error}</div>
                </template>
                <template if:true={selected}>
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">{selected.title}</h2>
                    <lightning-formatted-rich-text value={selected.html}></lightning-formatted-rich-text>
                </template>
                <template if:false={selected}>
                    <div class="slds-text-color_weak">Select a note to view it here.</div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>

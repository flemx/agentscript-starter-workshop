<template>
    <lightning-card>
        <div class="slds-p-horizontal_large slds-p-vertical_medium">
            <!-- Hero -->
            <div class="slds-media slds-media_center slds-m-bottom_medium">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-bot" title="Employee Agent Workshop">
                        <lightning-icon icon-name="standard:bot" size="large" alternative-text="Agent"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h1 class="slds-text-heading_large">Employee Agent V1 Workshop</h1>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        Build your own meeting-note agent — log notes, summarize them, and take action — right here in your org.
                    </p>
                </div>
            </div>

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <!-- Error -->
                <template if:true={error}>
                    <div class="slds-box slds-theme_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" variant="inverse" size="x-small"
                            class="slds-m-right_x-small"></lightning-icon>
                        <span>{error}</span>
                    </div>
                </template>

                <!-- Step 1: Open the guide -->
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-box slds-box_x-small step-card">
                            <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                                <span class="step-num">1</span> Follow the guide
                            </h2>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                The self-guided web app walks you through every step of building your agent.
                            </p>
                            <template if:true={hasGuideUrl}>
                                <lightning-button
                                    label="Open the workshop guide"
                                    icon-name="utility:new_window"
                                    variant="brand-outline"
                                    onclick={handleOpenGuide}>
                                </lightning-button>
                            </template>
                            <template if:false={hasGuideUrl}>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Guide link not configured yet — ask your facilitator for the URL.
                                </p>
                            </template>
                        </div>
                    </div>

                    <!-- Step 2: Run setup -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-box slds-box_x-small step-card">
                            <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                                <span class="step-num">2</span> Run post-install setup
                            </h2>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                Assign the permission sets you need so the agent works the moment you commit it.
                            </p>
                            <lightning-button
                                label={setupButtonLabel}
                                icon-name="utility:setup_assistant_guide"
                                variant="brand"
                                disabled={isRunning}
                                onclick={handleRunSetup}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Status banner -->
                <div class={statusBannerClass} role="status">
                    <lightning-icon
                        icon-name="utility:info"
                        size="x-small"
                        class="slds-m-right_x-small"></lightning-icon>
                    <span>{statusBannerText}</span>
                </div>

                <!-- Permission item list -->
                <template if:true={hasItems}>
                    <h3 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">
                        Permissions
                    </h3>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={items} for:item="item">
                            <li key={item.key} class="slds-item slds-grid slds-grid_align-spread slds-p-vertical_xx-small">
                                <div class="slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <lightning-icon
                                            icon-name={item.iconName}
                                            variant={item.iconVariant}
                                            size="x-small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <span class="slds-text-body_regular">{item.name}</span>
                                        <span class="slds-text-body_small slds-text-color_weak"> · {item.typeLabel}</span>
                                        <div class="slds-text-body_small slds-text-color_weak">{item.message}</div>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>

                <!-- Next step -->
                <template if:true={setupComplete}>
                    <div class="slds-box slds-theme_success slds-m-top_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">🎉 You're ready to build</h3>
                        <p class="slds-text-body_small">
                            Open <strong>Agent Studio</strong> from the App Launcher, click your starter agent, and
                            follow the guide through Part A.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>

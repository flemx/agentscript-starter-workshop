<template>
    <div class="nc-root">
        <!-- Header -->
        <div class="nc-header">
            <span class="nc-logo">
                <lightning-icon icon-name="utility:einstein" variant="inverse" size="small"></lightning-icon>
            </span>
            <div class="nc-heading">
                <h2 class="nc-title">Capture Meeting Notes</h2>
                <p class="nc-subtitle">Attach files, record audio, or paste notes — then send to your agent</p>
            </div>
        </div>

        <!-- Composer -->
        <div
            class={composerClass}
            ondragover={handleDragOver}
            ondragleave={handleDragLeave}
            ondrop={handleDrop}>

            <!-- Attachment tray -->
            <template if:true={hasAttachments}>
                <div class="nc-tray">
                    <template for:each={attachments} for:item="a">
                        <div key={a.key} class="nc-chip">
                            <template if:true={a.isImage}>
                                <img src={a.thumbnailUrl} alt={a.name} class="nc-thumb" />
                            </template>
                            <template if:true={a.isFile}>
                                <span class="nc-chip-icon">
                                    <lightning-icon icon-name={a.iconName} size="small"></lightning-icon>
                                </span>
                            </template>
                            <span class="nc-chip-meta">
                                <span class="nc-chip-name">{a.name}</span>
                            </span>
                            <button
                                class="nc-chip-x"
                                data-key={a.key}
                                onclick={removeFile}
                                title="Remove"
                                aria-label="Remove attachment">
                                <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                            </button>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Live recording state -->
            <template if:true={isRecording}>
                <div class="nc-recording">
                    <div class="waveform">
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span>
                    </div>
                    <span class="nc-recording-label">Recording…</span>
                    <span class="timer">{timerDisplay}</span>
                </div>
            </template>

            <!-- Inline status -->
            <template if:true={isTranscribing}>
                <div class="nc-status">
                    <lightning-spinner alternative-text="Transcribing" size="small"></lightning-spinner>
                    <span>Transcribing audio…</span>
                </div>
            </template>
            <template if:true={isProcessingFiles}>
                <div class="nc-status">
                    <lightning-spinner alternative-text="Reading files" size="small"></lightning-spinner>
                    <span>Reading attached files…</span>
                </div>
            </template>

            <!-- Text input -->
            <textarea
                class="nc-textarea"
                value={pastedText}
                onchange={handleTextChange}
                oninput={handleInput}
                onkeydown={handleKeyDown}
                placeholder="Paste or type meeting notes here…  (Enter to send · Shift+Enter for a new line)"></textarea>

            <!-- Action bar -->
            <div class="nc-actions">
                <div class="nc-actions-left">
                    <button
                        class="icon-btn"
                        onclick={openFilePicker}
                        disabled={attachDisabled}
                        title="Attach files"
                        aria-label="Attach files">
                        <lightning-icon icon-name="utility:attach" size="small"></lightning-icon>
                    </button>
                    <input
                        type="file"
                        multiple
                        accept="image/*,application/pdf,.doc,.docx,.txt"
                        onchange={handleFilePick}
                        style="display:none" />
                    <button
                        class={micButtonClass}
                        onclick={toggleRecording}
                        title={micTitle}
                        aria-label={micTitle}>
                        <lightning-icon icon-name={micIcon} size="small"></lightning-icon>
                    </button>
                </div>
                <div class="nc-actions-right">
                    <div class="nc-agent">
                        <lightning-combobox
                            name="agent"
                            variant="label-hidden"
                            value={selectedAgent}
                            options={agentOptions}
                            onchange={handleAgentChange}
                            placeholder="Choose an agent…">
                        </lightning-combobox>
                    </div>
                    <button
                        class="send-btn"
                        disabled={sendDisabled}
                        onclick={handleSend}
                        title="Send to agent"
                        aria-label="Send to agent">
                        <lightning-icon icon-name="utility:send" variant="inverse" size="small"></lightning-icon>
                    </button>
                </div>
            </div>
        </div>

        <template if:true={error}>
            <div class="nc-error" role="alert">{error}</div>
        </template>
    </div>
</template>

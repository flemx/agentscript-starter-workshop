<template>
    <div class="slds-box slds-box_x-small accel-card">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
            <h2 class="slds-text-heading_small">
                <lightning-icon icon-name="utility:flow" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                Accelerator — deploy the agent for me
            </h2>
            <span class="slds-badge slds-badge_lightest">Optional</span>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            Skips ahead by deploying, publishing, and activating the starter agent automatically — and
            assigns you access. Use this for the backup org or if you get stuck; otherwise build it
            yourself in Agent Studio (that's the fun part).
        </p>

        <lightning-button
            label={buttonLabel}
            variant="neutral"
            icon-name="utility:agent_astro"
            disabled={isRunning}
            onclick={handleDeploy}>
        </lightning-button>

        <template if:true={isRunning}>
            <div class="slds-m-top_small">
                <lightning-spinner alternative-text="Deploying" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={isDone}>
            <div class="slds-box slds-theme_success slds-m-top_small">
                <p class="slds-text-body_small">
                    ✅ Published &amp; activated.
                    <template if:true={result.publishedBotId}>
                        Bot id: <code>{result.publishedBotId}</code>.
                    </template>
                    Open any app to use the agent.
                </p>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-box slds-theme_error slds-m-top_small" role="alert">
                <p class="slds-text-body_small">{error}</p>
            </div>
        </template>
    </div>
</template>

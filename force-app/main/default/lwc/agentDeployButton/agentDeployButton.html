<template>
    <div class="slds-box slds-box_x-small accel-card">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
            <h2 class="slds-text-heading_small">
                <lightning-icon icon-name="utility:agent_astro" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                {cardTitle}
            </h2>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            {cardDescription} Safe to re-run: it won't create a duplicate.
        </p>

        <lightning-button
            label={buttonLabel}
            variant="brand"
            icon-name="utility:agent_astro"
            disabled={isRunning}
            onclick={handleDeploy}>
        </lightning-button>

        <div class="slds-m-top_x-small">
            <lightning-input
                type="checkbox"
                label="Deploy a fresh copy (new name) instead of reusing an existing agent"
                checked={forceNew}
                onchange={handleForceNewChange}>
            </lightning-input>
        </div>

        <template if:true={isRunning}>
            <div class="slds-m-top_small">
                <lightning-spinner alternative-text="Installing" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={isDone}>
            <div class="slds-box slds-theme_success slds-m-top_small">
                <p class="slds-text-body_small">
                    <template if:true={result.alreadyExisted}>ℹ️ </template>
                    <template if:false={result.alreadyExisted}>✅ </template>
                    {result.message}
                    <template if:true={agentLabel}>
                        <br/>Agent: <strong>{agentLabel}</strong>.
                    </template>
                </p>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-box slds-theme_error slds-m-top_small" role="alert">
                <p class="slds-text-body_small">{error}</p>
            </div>
        </template>
    </div>
</template>
